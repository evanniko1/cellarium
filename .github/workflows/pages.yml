# DOC-1 (publication half) — deploy the MkDocs site to GitHub Pages.
#
# HISTORY, kept because it explains the shape. This was manual-only while the NeurIPS submission was under
# anonymous review — publishing is a decision, not a build step, and a project page normally carries the
# owner's username in its URL. Both reasons have since lapsed: the submission is in, and the account has a
# custom domain on its user site, so this repo publishes to emnikolados.dev/cellarium with no username in
# the address. The push trigger below is therefore live; workflow_dispatch stays for manual re-publishes.
#
# The build here is deliberately IDENTICAL to the `Docs — build (strict)` step in ci.yml: same --strict,
# same install. If the two ever diverge, the site that ships stops being the site CI checked.

name: Docs — publish to GitHub Pages

on:
  # Pages was enabled with Source == "GitHub Actions" on 2026-09-11, so automatic publication is live.
  # Scoped to the paths that can change the site: a push touching only src/ or tests/ rebuilds nothing.
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write            # required by actions/deploy-pages
  id-token: write         # required by actions/deploy-pages (OIDC, no long-lived token)

# Never let two deploys race; let a newer one supersede a queued older one but never cancel a
# deploy already in flight, which can leave Pages serving a half-uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (docs extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # --strict is the point: a broken internal link or an unlisted page fails the build rather than
      # shipping a site with a dead link in it. tests/test_docs_site.py covers the case --strict CANNOT
      # see — a nav entry or in-page link pointing at a file that exists locally and is gitignored.
      - name: Build (strict)
        run: mkdocs build --strict --site-dir ./site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
