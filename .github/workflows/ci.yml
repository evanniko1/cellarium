name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (package + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hf,surrogate,mcp]"   # surrogate (scikit-learn) is light enough to test in CI, unlike fba/rnaseq.
          # mcp is here so tests/test_mcp_server_wire.py RUNS rather than skipping: it importorskips the SDK, and a
          # suite where the wiring test always skips reports nothing about the wiring. The policy half
          # (tests/test_mcp_surface.py) needs no SDK by design and runs either way.

      # H-14: secret scanning with gitleaks, replacing the regex that could not tell a protein from a key.
      #
      # WHAT WAS WRONG. The old step was `git grep -E 'AKIA[0-9A-Z]{16}|...'`. Proteins are written as runs of
      # uppercase single-letter amino-acid codes, so that pattern matched 40 lines of
      # vendor/v301/reconstruction/ecoli/flat/proteins.tsv — 20-mers, not AWS keys. Because the step exits 1
      # on any match it once blocked ruff and pytest from running at all; the workaround was to stop scanning
      # vendor/ and model_overlay/ entirely, which traded a false alarm for a blind spot.
      #
      # WHY THIS IS BETTER, MEASURED 2026-09-10 on the tracked tree (499 files, 28 MB, 3.5 s):
      #   * 0 findings — on the SAME proteins.tsv where the old regex still fires 40 times. gitleaks decides
      #     with each rule's own shape plus Shannon entropy, so amino-acid letters do not look like a secret.
      #   * vendor/ and model_overlay/ are therefore SCANNED AGAIN rather than excluded.
      #   * detection verified by planting three non-example credentials (a random AKIA + secret, and a
      #     ghp_ token): 2 leaks found. Note that AWS's *documented example* key is allowlisted upstream by
      #     design, so a planted AKIAIOSFODNN7EXAMPLE proves nothing — the check has to use random values.
      #
      # Scans the TRACKED tree via `git archive`, so untracked local state (.venv, runs*/, out/) is out of
      # scope by construction rather than by an exclude list that could drift.
      - name: Secret scan — gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"             | tar -xz -C /tmp gitleaks
          mkdir -p /tmp/scan && git archive HEAD | tar -x -C /tmp/scan
          cp .gitleaks.toml /tmp/scan/
          if ! /tmp/gitleaks detect --source=/tmp/scan --no-git --config=/tmp/scan/.gitleaks.toml                  --redact --no-banner --report-format=sarif --report-path=/tmp/gitleaks.sarif; then
            echo "::error::gitleaks found a potential secret in tracked files — remove it from git history and rotate the credential."
            exit 1
          fi
          echo "gitleaks ${VER}: no secrets in tracked files (vendor/ and model_overlay/ INCLUDED; see .gitleaks.toml)."

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: /tmp/gitleaks.sarif
          if-no-files-found: ignore

      - name: Lint — ruff
        run: ruff check .

      # junit_family=xunit1 is deliberate: the default xunit2 schema DROPS the testcase `file`/`line`
      # attributes, so a failure annotation would anchor to the workflow file instead of the failing test
      # (verified end-to-end on a throwaway branch before this was trusted).
      - name: Test — pytest
        run: pytest --junitxml=pytest-report.xml -o junit_family=xunit1

      # A CI failure must name the failing TEST, not just "exit code 1". The job log needs a token to download,
      # so on a red run the only thing readable through the unauthenticated API is the annotation stream — this
      # turns each failing test into an annotation (+ a job summary). Runs only on failure; never masks it.
      - name: Surface failing tests (annotations)
        if: failure()
        run: python .github/scripts/pytest_annotate.py pytest-report.xml

      # The full machine-readable report, for the cases annotations bound (>30 failures, or a parse error).
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore

      # Advisory only for now (untyped surfaces remain) — tightening is BACKLOG H-2.
      # DOC-1: build the documentation site, STRICTLY. --strict turns a broken internal link or an
      # unlisted page into a build failure, which is the whole reason the docs live in this repo rather
      # than in a wiki: code/prose drift is the defect this project keeps catching in itself, and a wiki
      # is in a separate repository where CI cannot see it. On the first strict build this caught 7 real
      # broken links, two of them pointing at BACKLOG.md — which is gitignored, so those were broken for
      # every person who clones, not merely on the site.
      - name: Docs — build (strict)
        run: |
          pip install -e ".[docs]"
          mkdocs build --strict --site-dir /tmp/site

      - name: Upload docs site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: /tmp/site
          if-no-files-found: ignore

      - name: Type-check — mypy (advisory)
        continue-on-error: true
        run: mypy src/cellarium
