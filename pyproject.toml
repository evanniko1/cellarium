[project]
name = "cellarium"
version = "0.1.0"
description = "A Claude-backed copilot for grounded reasoning over a whole-cell E. coli simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Evangelos-Marios Nikolados" }]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyarrow>=15",
    "starlette>=0.37",     # the web glass-box (apps/server.py); SQLite session store uses stdlib sqlite3
    "uvicorn>=0.29",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24"]   # only for the corpus upload scripts (scripts/hf_*.py)
fba = ["cobra>=0.29"]            # SCI-1: the independent genome-scale FBA cross-check over iML1515 (opt-in; pulls scipy/pandas/optlang + a solver). Keeps the core scipy-free.
rnaseq = ["pydeseq2>=0.4"]       # SCI-2: sim-vs-real RNA-seq (PRECISE-1K) concordance (opt-in; pulls scipy/pandas/anndata). DESeq2 runs on the DATA side only.
surrogate = ["scikit-learn>=1.3"]  # SCI-5: the ML viability-triage surrogate (opt-in; pulls scipy). The core stays scikit-learn-free.
keyvault = ["keyring>=25"]       # in-app API-key storage via the OS keychain (Settings tab). Optional by design: with it absent the vault reports can_persist=False and the app falls back to a .env / exported variable, so CI and headless boxes need nothing.
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
cellarium = "cellarium.cli:main"
cellarium-generate = "cellarium.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellarium"]

[tool.ruff]
line-length = 120
extend-exclude = [
    "skills",          # vendored third-party skills — not ours to lint
    "model_patches",   # model-tree code in the MODEL's style: wcEcoli is tab-indented throughout, so these
                       # files must keep tabs to match the tree they are installed into. Linting them under
                       # Cellarium's space convention reports 75 mixed-indentation errors for code that is
                       # correct where it runs. Installed by scripts/apply_model_variants.py.
    "model_overlay",   # the FINISHED wcEcoli files this repo ships (see docs/OVERLAY.md). Same reason as
                       # model_patches, at the scale of the whole port: it is wcEcoli source, tab-indented,
                       # and byte-identical to what gets copied into the checkout. Linting it would be
                       # linting upstream's style, and any "fix" would silently desynchronise the file from
                       # the sha256 recorded in model_overlay/MANIFEST.json.
    "vendor",          # the v3.0.1 reference tree, for the SAME reason and at a much larger scale: it is
                       # upstream wcEcoli source, tab-indented, and linting it reports 5093 errors — 94.6%
                       # of everything ruff finds in this repo. It is a read-only reference that
                       # scripts/apply_trna_port.py copies FROM; it is never edited here, so Cellarium's
                       # style rules do not apply to it. Committed (not gitignored) because the port must
                       # be reproducible from a clone.
    "archive",         # preserved EVIDENCE, not code. archive/route1_analysis_scripts/ holds 17 files copied
                       # VERBATIM out of C:/dev/wcEcoli/out before the ROUTE1 runs were deleted, and verified
                       # byte-identical to their originals by md5 (see its README + docs/ROUTE1_CORPUS_RECORD.md,
                       # which cites them by name as the definitions of the interventions it reports). Ruff finds
                       # 14 errors in them (13 import-sort, 1 unused local); every available "fix" would edit a
                       # file whose whole value is that it is unmodified, breaking the md5 claim the record rests
                       # on. Nothing in Cellarium imports them and no test covers them.
]

[tool.ruff.lint]
# The codebase deliberately uses compact one-liners (semicolons) and long single-line tool-description strings,
# so line-length + multi-statement style rules are off; keep the real-bug rules (pyflakes F + core pycodestyle E/W)
# plus import sorting (I) so import order is consistent + CI-enforced (H-2).
select = ["E", "F", "W", "I"]
ignore = ["E501", "E702", "E401", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/parallel needs Docker (opt-in via CELLARIUM_DOCKER_TESTS, skipped otherwise); the raw-simOut drill-down
# tests skip cleanly when no local raw is present (e.g. on CI).

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Advisory only for now (CI runs it non-blocking); tightening typing is BACKLOG H-2.
