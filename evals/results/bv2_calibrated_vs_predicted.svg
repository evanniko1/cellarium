<svg viewBox="0 0 900 500" role="img" aria-label="BV-2. a, growth effects of perturbations the fit never saw, with the direction the literature reports. b, for responses in conditions the fit is given, the knowledge base input, the model output and the organism measurement on one axis."><g font-family="IBM Plex Sans, sans-serif" font-size="11" fill="currentColor"><g fill="none" stroke="currentColor" stroke-opacity="0.22"><rect x="4" y="6" width="380" height="488" rx="6"/><rect x="392" y="6" width="504" height="488" rx="6"/></g><text x="14" y="28" font-size="12.5" font-weight="700">a</text><text x="30" y="28" font-weight="600">Perturbations the fit never saw: growth (%)</text><line x1="176" y1="44" x2="176" y2="320" stroke="currentColor" stroke-opacity="0.5"/><text x="176" y="40" font-size="9.5" fill-opacity="0.7">growth decline, %</text><text x="14" y="68">ppGpp 0.2x</text><rect x="176" y="56" width="104.41999999999999" height="16" fill="#0c6b53" fill-opacity="0.75"/><text x="286.41999999999996" y="68" font-family="IBM Plex Mono, monospace" font-size="10">-22.7</text><text x="14" y="114">ppGpp 0.6x</text><rect x="176" y="102" width="34.5" height="16" fill="#0c6b53" fill-opacity="0.75"/><text x="216.5" y="114" font-family="IBM Plex Mono, monospace" font-size="10">-7.5</text><text x="14" y="160">ppGpp 1.6x</text><rect x="176" y="148" width="32.199999999999996" height="16" fill="#0c6b53" fill-opacity="0.75"/><text x="214.2" y="160" font-family="IBM Plex Mono, monospace" font-size="10">-7.0</text><text x="14" y="206">ppGpp 2.0x</text><rect x="176" y="194" width="98.89999999999999" height="16" fill="#0c6b53" fill-opacity="0.75"/><text x="280.9" y="206" font-family="IBM Plex Mono, monospace" font-size="10">-21.5</text><text x="14" y="252">4 rRNA operons removed</text><rect x="176" y="240" width="92.46" height="16" fill="#0c6b53" fill-opacity="0.75"/><text x="274.46" y="252" font-family="IBM Plex Mono, monospace" font-size="10">-20.1</text><text x="14" y="298">6 rRNA operons removed</text><rect x="176" y="286" width="162.37999999999997" height="16" fill="#0c6b53" fill-opacity="0.75"/><text x="344.38" y="298" font-family="IBM Plex Mono, monospace" font-size="10">-35.3</text><text x="14" y="340" font-size="10.5">Literature: both raised and lowered ppGpp slow growth (Zhu and Dai 2019);</text><text x="14" y="354" font-size="10.5">removing rRNA operons slows growth moderately (Asai et al. 1999).</text><text x="14" y="372" font-size="10.5" fill="#0c6b53" font-weight="600">Direction reproduced in every case: prediction.</text><text x="14" y="388" font-size="10" fill-opacity="0.7">ppGpp against basal; rRNA against 2 operons removed; 4 seeds each.</text><text x="402" y="28" font-size="12.5" font-weight="700">b</text><text x="418" y="28" font-weight="600">Conditions the fit is given: input, model, organism</text><rect x="415" y="41" width="10" height="10" fill="#8a5a00"/><text x="430" y="50">knowledge-base input</text><circle cx="570" cy="46" r="5.5" fill="#0f6f7a"/><text x="580" y="50">model</text><path d="M720 39.5 L726.5 46 L720 52.5 L713.5 46 z" fill="#9c2d37"/><text x="730" y="50">organism</text><line x1="590" y1="150" x2="880" y2="150" stroke="currentColor" stroke-opacity="0.4"/><line x1="590.0" y1="147" x2="590.0" y2="153" stroke="currentColor" stroke-opacity="0.4"/><text x="590.0" y="165" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace">-80</text><line x1="654.4444444444445" y1="147" x2="654.4444444444445" y2="153" stroke="currentColor" stroke-opacity="0.4"/><text x="654.4444444444445" y="165" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace">-60</text><line x1="718.8888888888889" y1="147" x2="718.8888888888889" y2="153" stroke="currentColor" stroke-opacity="0.4"/><text x="718.8888888888889" y="165" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace">-40</text><line x1="783.3333333333333" y1="147" x2="783.3333333333333" y2="153" stroke="currentColor" stroke-opacity="0.4"/><text x="783.3333333333333" y="165" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace">-20</text><line x1="847.7777777777778" y1="147" x2="847.7777777777778" y2="153" stroke="currentColor" stroke-opacity="0.4"/><text x="847.7777777777778" y="165" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace">+0</text><text x="880" y="178" text-anchor="end" font-size="9.5" fill-opacity="0.7">growth change, %</text><text x="404" y="86">acetate, growth vs glucose (%)</text><line x1="847.7777777777778" y1="74" x2="847.7777777777778" y2="90" stroke="currentColor" stroke-opacity="0.2"/><rect x="624.9555555555555" y="77" width="10" height="10" fill="#8a5a00"/><circle cx="740.1555555555556" cy="82" r="5.5" fill="#0f6f7a"/><path d="M653.1555555555556 75.5 L659.6555555555556 82 L653.1555555555556 88.5 L646.6555555555556 82 z" fill="#9c2d37"/><text x="404" y="116">succinate, growth vs glucose (%)</text><line x1="847.7777777777778" y1="104" x2="847.7777777777778" y2="120" stroke="currentColor" stroke-opacity="0.2"/><rect x="693.588888888889" y="107" width="10" height="10" fill="#8a5a00"/><circle cx="772.0555555555555" cy="112" r="5.5" fill="#0f6f7a"/><line x1="590" y1="372" x2="880" y2="372" stroke="currentColor" stroke-opacity="0.4"/><line x1="626.25" y1="369" x2="626.25" y2="375" stroke="currentColor" stroke-opacity="0.4"/><text x="626.25" y="387" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace">-2</text><line x1="698.75" y1="369" x2="698.75" y2="375" stroke="currentColor" stroke-opacity="0.4"/><text x="698.75" y="387" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace">+0</text><line x1="771.25" y1="369" x2="771.25" y2="375" stroke="currentColor" stroke-opacity="0.4"/><text x="771.25" y="387" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace">+2</text><line x1="843.75" y1="369" x2="843.75" y2="375" stroke="currentColor" stroke-opacity="0.4"/><text x=